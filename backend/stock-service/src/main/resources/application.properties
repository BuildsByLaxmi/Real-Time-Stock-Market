spring.application.name=stockmarket

# ---- Stock API (Member 2) ----
# Set the key as an ENVIRONMENT VARIABLE, never commit it:
#   Windows PowerShell:  $env:TWELVE_DATA_API_KEY="your-key"
#   Mac/Linux:           export TWELVE_DATA_API_KEY="your-key"
stock.api.key=${TWELVE_DATA_API_KEY:}

# ---- Database (Member 1) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stockmarket?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT (Member 1) ----
# Secret must be at least 32 characters. Override with the JWT_SECRET env variable.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-minutes=1440

# ---- Analytics & Reports (Member 4) ----
# true = always use simulated demo data (also used automatically when no API key is set)
analytics.demo-data=${ANALYTICS_DEMO_DATA:false}
